name: matelematics-nats-b0
services:
  nats:
    image: nats:2.14.7
    container_name: matelematics-nats
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:18222:8222"
    volumes:
      - nats_jetstream_data:/data
volumes:
  nats_jetstream_data:
